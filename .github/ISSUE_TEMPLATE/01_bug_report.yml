name: "Bug report"
description: "Report a reproducible defect in a Bilgin Apps product or service."
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Bilgin Apps.

        **Security vulnerabilities:** Do not report them in a public issue. Follow the [security policy](https://github.com/bilgin-apps/.github/blob/main/SECURITY.md) instead.

        Remove all credentials, access tokens, learner information, personal data, and production secrets from the report and any attachments.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Which product or shared service is affected?
      options:
        - "Bilgin Exam TR"
        - "Bilgin ABC"
        - "Shared infrastructure / organization"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - "Mobile application"
        - "Backend / API"
        - "Admin panel"
        - "Website"
        - "Learning content / curriculum"
        - "CI/CD / infrastructure"
        - "Other / unknown"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the defect and its impact on the user or system.
      placeholder: "The learner cannot resume a lesson after..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide reproducible steps using test data only.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - "Local development"
        - "QA / test-env"
        - "Production"
        - "Unknown"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version, build, or commit
      description: Include a version, build number, or commit SHA when known.
      placeholder: "e.g., v0.2.0-beta / build 42 / commit abc1234"
  - type: input
    id: platform
    attributes:
      label: Device, OS, or browser
      placeholder: "e.g., iPhone / iOS version; Android; Chrome"
  - type: dropdown
    id: impact
    attributes:
      label: Reported impact
      description: Initial reporter assessment; maintainers determine final priority.
      options:
        - "Critical: service unavailable, data loss, or severe disruption"
        - "High: primary workflow blocked"
        - "Medium: partial functionality impaired"
        - "Low: minor or cosmetic defect"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Optional screenshots, redacted logs, or videos. Never include confidential data.
      placeholder: "Paste sanitized log excerpts or attach screenshots here."
  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checklist
      options:
        - label: "I searched for an existing issue covering this problem."
          required: true
        - label: "I removed secrets, personal data, and sensitive information from this report."
          required: true
